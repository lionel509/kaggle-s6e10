[project]
name = "s6e10"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "lionel509", email = "lionelweng@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
    "xgboost>=3.4.1",
]

[project.scripts]
s6e10 = "s6e10:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
